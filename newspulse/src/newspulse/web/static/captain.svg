<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Captain Comms">
  <!--
    Captain Comms — an original mark, not a copy of any existing artwork.

    Built from four flat shapes so it survives being shrunk: a cape behind, a
    shield body, a mask band, and a C monogram. Everything is geometry rather
    than detail — at 20px in a button the face, cuffs and cape folds of a drawn
    character turn to mud, while a shield silhouette with one letter still reads.

    The palette is the comic-hero pairing (deep green, gold) rather than the
    app's indigo, so the assistant is recognisably its own thing inside a UI that
    is otherwise indigo and grey.
  -->

  <!-- Cape: two wings behind the shield. -->
  <path d="M32 6 6 16v16c0 4 3 7 7 7l6-3V15z" fill="#0f3f2e"/>
  <path d="M32 6l26 10v16c0 4-3 7-7 7l-6-3V15z" fill="#0f3f2e"/>

  <!-- Shield body, with a lighter inner face for depth without gradients. -->
  <path d="M32 5 12 12v20c0 12 8 21 20 27 12-6 20-15 20-27V12z" fill="#14523c"/>
  <path d="M32 9 16 15v17c0 10 6.5 17.5 16 22.5 9.5-5 16-12.5 16-22.5V15z" fill="#22815f"/>

  <!-- Mask band: the one character cue that survives at small sizes. -->
  <path d="M16 21h32v6H16z" fill="#0f3f2e" opacity=".5"/>

  <!-- C monogram. An arc with a deliberate gap, so it reads as C and not O. -->
  <path d="M40 27a10.5 10.5 0 1 0 0 12.5" fill="none" stroke="#f2b32e"
        stroke-width="6.5" stroke-linecap="round"/>
</svg>
