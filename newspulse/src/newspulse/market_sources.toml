# NewsPulse curated market source list (DEC-1 B, the curated half).
#
# The three classes a news feed never carries: studies, regulatory dates and
# events. This file is editable — add, remove or reclassify a source without
# touching code. Each entry is a `[[sources]]` table with:
#   name  (required) — human label, and the publisher credited on a signal from a
#                      source that does not name its own
#   url   (required) — the RSS/Atom feed URL
#   kind  (required) — one of: studie, regulierung, veranstaltung
#
# This is the half of the radar that applies to every mandate. The other half is
# a per-mandate search in the client's own field, built in market_sources.py and
# stored with origin = "suche", so a reader can always tell the two apart.
#
# The list is global on purpose for now: a mandate that wants its own trade
# association added is a settings change once the shape here has proven itself.
#
# Reachability is not checked in the test suite (nothing here touches the
# network). A source that has moved or gone dark logs at ERROR on the next sweep
# and stores nothing for its class, which is how a stale entry announces itself.
#
# Only feed-provided fields are ever ingested. Full article bodies are never
# fetched or stored (Leistungsschutzrecht) — see ingest.py.

