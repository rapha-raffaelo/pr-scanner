# NewsPulse curated German feed registry.
#
# This file is editable: add, remove, or retag feeds without touching code. Each
# entry is a `[[feeds]]` table with:
#   name      (required) — human label, also used as the article `source`
#   url       (required) — the RSS/Atom feed URL
#   industry  (optional) — a coarse sector tag for trade-press feeds; omit or
#                          leave empty for general national outlets
#
# Only feed-provided fields are ever ingested (headline, link, date, the feed's
# own summary). Full article bodies are never fetched or stored
# (Leistungsschutzrecht) — see ingest.py.

