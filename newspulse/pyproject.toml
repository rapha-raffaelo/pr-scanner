[project]
name = "newspulse"
version = "0.1.0"
description = "Local German media monitor for a PR client portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "feedparser>=6.0",

    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newspulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
