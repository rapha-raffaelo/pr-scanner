[project]
name = "newspulse"
version = "0.1.0"
description = "Local German media monitor for a PR client portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "feedparser>=6.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    # The IANA zone database as a wheel. ZoneInfo falls back to it when the host
    # has no /usr/share/zoneinfo — true of some slim container images — and
    # without it the configured display zone silently degrades to UTC, which is
    # the exact bug NEWSPULSE_TIMEZONE exists to fix.
    "tzdata>=2024.1",
    # Text extraction for the communications guide. A brand guideline arrives as a
    # PDF; pure-Python and small, so it costs the image nothing. Plain text and
    # Markdown need no library at all, and .docx is deliberately not supported yet
    # rather than half-supported — see web/routes/guide.py.
    "pypdf>=5.0",
]

[project.scripts]
newspulse = "newspulse.cli:main"
newspulse-web = "newspulse.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newspulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
